kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  - containerPort: 6443
    hostPort: 6443
    protocol: TCP
  extraMounts:
  - hostPath: /tmp/sovereign-storage/longhorn
    containerPath: /var/lib/longhorn
  - hostPath: /tmp/sovereign-storage/openebs
    containerPath: /var/openebs
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  apiServer:
    certSANs:
    - localhost
    - 127.0.0.1
