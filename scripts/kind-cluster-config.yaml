kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  # Use high ports to avoid requiring root on Linux
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
  - containerPort: 30443
    hostPort: 30443
    protocol: TCP
  - containerPort: 30000
    hostPort: 30000
    protocol: TCP
  extraMounts:
  - hostPath: /tmp/sovereign-storage/longhorn
    containerPath: /var/lib/longhorn
  - hostPath: /tmp/sovereign-storage/openebs
    containerPath: /var/openebs
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  apiServer:
    certSANs:
    - localhost
    - 127.0.0.1
