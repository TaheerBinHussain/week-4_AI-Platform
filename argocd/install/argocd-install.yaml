apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Source: https://raw.githubusercontent.com/argoproj/argo-cd/v2.12.3/manifests/install.yaml
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v2.12.3/manifests/install.yaml
namespace: argocd
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
        namespace: argocd
      data:
        server.insecure: "false"
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
