replicaCount: 1
persistence:
  storageClassName: openebs-local-nvme
  size: 20Gi
env:
  - name: QDRANT__SERVICE__API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-credentials
        key: apiKey
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 4Gi
livenessProbe:
  httpGet:
    path: /healthz
    port: 6333
readinessProbe:
  httpGet:
    path: /readyz
    port: 6333
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
metrics:
  serviceMonitor:
    enabled: true
