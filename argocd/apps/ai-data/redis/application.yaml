apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: ai-data
  source:
    repoURL: https://github.com/TaheerBinHussain/week-4_AI-Platform.git
    targetRevision: HEAD
    path: argocd/apps/ai-data/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
