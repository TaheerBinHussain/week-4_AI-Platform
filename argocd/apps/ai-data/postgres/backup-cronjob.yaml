apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: ai-data
spec:
  schedule: "0 2 * * *"
  backoffLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          containers:
            - name: pg-backup
              image: bitnami/postgresql:16
              command:
                - /bin/bash
                - -c
                - |
                  pg_dumpall -h postgres-postgresql -U postgres | gzip > /tmp/backup.sql.gz
                  # Note: Upload via mc assuming it's available or use curl/AWS CLI
                  echo "Backup complete"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: rootUser
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: rootPassword
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          restartPolicy: OnFailure
