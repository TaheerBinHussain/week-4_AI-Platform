apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ollama-scaler
  namespace: ai-platform
spec:
  scaleTargetRef:
    name: ollama
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.observability.svc.cluster.local:9090
        metricName: ollama_active_requests
        query: sum(rate(ollama_request_duration_seconds_count{job="ollama"}[1m]))
        threshold: '5'
# Scale Ollama when request rate exceeds 5 req/s
