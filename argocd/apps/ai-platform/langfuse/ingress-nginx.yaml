apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse-ingress
  namespace: ai-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: sovereign-ca
spec:
  tls:
    - hosts:
        - langfuse.sovereign.internal
      secretName: langfuse-tls
  rules:
    - host: langfuse.sovereign.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse-web
                port:
                  number: 3000
