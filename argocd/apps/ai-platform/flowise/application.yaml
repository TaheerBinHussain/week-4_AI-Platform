apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flowise
  namespace: argocd
spec:
  project: ai-platform
  source:
    repoURL: ${GITHUB_REPO}
    targetRevision: HEAD
    path: argocd/apps/ai-platform/flowise
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
