apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
  namespace: ai-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: sovereign-ca
spec:
  tls:
    - hosts:
        - chat.sovereign.internal
      secretName: open-webui-tls
  rules:
    - host: chat.sovereign.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 80
