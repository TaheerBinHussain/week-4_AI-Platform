apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: sovereign-ai-platform
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/${GITHUB_USER}/${GITHUB_REPO}
  secretRef:
    name: flux-system
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sovereign-ai-platform
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/clusters/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: sovereign-ai-platform
