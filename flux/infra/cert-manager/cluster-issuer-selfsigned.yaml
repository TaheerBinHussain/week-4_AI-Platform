apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sovereign-ca-cert
  namespace: platform-infra
spec:
  isCA: true
  commonName: sovereign.internal CA
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  secretName: sovereign-ca-secret
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: sovereign-ca
  # sovereign-ca is the ClusterIssuer referenced by all Ingress/IngressRoute TLS configs
spec:
  ca:
    secretName: sovereign-ca-secret
