apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.106.1
      sourceRef:
        kind: HelmRepository
        name: opentelemetry-collector
      interval: 1h
  values:
    mode: deployment
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        prometheus:
          config:
            scrape_configs:
              - job_name: 'ollama'
                scrape_interval: 10s
                static_configs:
                  - targets: ['ollama.ai-platform.svc.cluster.local:11434']
      processors:
        batch:
          send_batch_size: 1000
          timeout: 10s
        memory_limiter:
          check_interval: 1s
          limit_mib: 256
      exporters:
        prometheusremotewrite:
          endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write
        loki:
          endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
        otlp/tempo:
          endpoint: http://tempo.observability.svc.cluster.local:4317
          tls:
            insecure: true
      service:
        pipelines:
          metrics:
            receivers: [otlp, prometheus]
            processors: [memory_limiter, batch]
            exporters: [prometheusremotewrite]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [loki]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp/tempo]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    serviceMonitor:
      enabled: true
    ports:
      otlp-grpc:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        hostPort: 4317
        protocol: TCP
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        hostPort: 4318
        protocol: TCP
