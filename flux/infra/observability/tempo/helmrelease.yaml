apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: tempo
      version: 1.10.3
      sourceRef:
        kind: HelmRepository
        name: tempo
      interval: 1h
  values:
    tempo:
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
    persistence:
      enabled: true
      storageClassName: longhorn-replicated
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    securityContext:
      runAsNonRoot: true
    serviceMonitor:
      enabled: true
