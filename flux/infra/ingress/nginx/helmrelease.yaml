apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: platform-infra
spec:
  interval: 1h
  chart:
    spec:
      chart: ingress-nginx
      version: 4.11.2
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
      interval: 1h
  values:
    controller:
      service:
        type: LoadBalancer
        loadBalancerIP: 172.18.100.11
      ingressClassResource:
        name: nginx
        default: false
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        runAsNonRoot: true
      admissionWebhooks:
        enabled: true
