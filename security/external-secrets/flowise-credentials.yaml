apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flowise-credentials
  namespace: ai-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: flowise-credentials
  data:
    - secretKey: passphrase
      remoteRef:
        key: ai-platform/flowise
        property: passphrase
