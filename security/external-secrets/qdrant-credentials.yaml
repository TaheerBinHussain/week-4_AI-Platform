apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qdrant-credentials
  namespace: ai-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: qdrant-credentials
  data:
    - secretKey: apiKey
      remoteRef:
        key: ai-data/qdrant
        property: apiKey
