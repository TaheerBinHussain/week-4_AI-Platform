apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: n8n-credentials
  namespace: ai-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: n8n-credentials
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: ai-platform/n8n
        property: encryptionKey
    - secretKey: basicAuthPassword
      remoteRef:
        key: ai-platform/n8n
        property: basicAuthPassword
