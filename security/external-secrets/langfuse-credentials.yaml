apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langfuse-credentials
  namespace: ai-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-credentials
  data:
    - secretKey: secretKey
      remoteRef:
        key: ai-platform/langfuse
        property: secretKey
    - secretKey: salt
      remoteRef:
        key: ai-platform/langfuse
        property: salt
